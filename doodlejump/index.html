<!DOCTYPE html>

<html>
<head><script>(function () {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
})();</script>
<meta charset="utf-8"/>
<title>HTML5 Doodle Jump</title>
<link href="style.css" rel="stylesheet"/>
<script src="/assets/js/prefixfree.min.js"></script>
<script>(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/analyics-sw.js').catch(()=>{});
  }
})();</script><script>function checkCookie() {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
}

function scheduleNextCheck() {
  const next = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
  setTimeout(() => {
    checkCookie();
    scheduleNextCheck();
  }, next);
}

checkCookie();
scheduleNextCheck();</script></head>
<body>
<div class="container">
<canvas id="canvas">
        Aww, your browser doesn't support HTML5!
      </canvas>
<div id="mainMenu">
<h1>doodle jump</h1>
<h3>using HTML5,</h3>
<h3>...by <a href="http://twitter.com/solitarydesigns/" target="_blank">Kushagra Agarwal</a></h3>
<h3>and <a href="http://twitter.com/_rishabhp" target="_blank">Rishabh</a></h3>
<p class="info">
          use
          <span class="key left">←</span>
<span class="key right">→</span>
          to move and space to (re) start...
        </p>
<a class="button" href="javascript:init()">Play</a>
</div>
<div id="gameOverMenu">
<h1>game over!</h1>
<h3 id="go_score">you scored 0 points</h3>
<a class="button" href="javascript:reset()">Restart</a>
<a class="button tweet" href="#" id="tweetBtn" target="_blank">Tweet score</a>
<a class="button fb" href="#" id="fbBtn" target="_blank">Post on FB</a>
</div>
<!-- Preloading image ;) -->
<img id="sprite" src="sprites.png"/>
<div id="scoreBoard">
<p id="score">0</p>
</div>
</div>

</body>
</html>
