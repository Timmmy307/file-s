<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Access Portal</title>
<style>
  :root { color-scheme: light dark; }
  body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#0f1115;color:#e7e7ea}
  .card{background:#151821;border:1px solid #272b36;border-radius:14px;padding:28px;max-width:520px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{margin:0 0 10px;font-size:22px}
  p{margin:0 0 16px;color:#a6adbb}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2d3342;background:#0f1320;color:#e7e7ea}
  button{margin-top:12px;width:100%;padding:12px 14px;border-radius:10px;border:0;background:#3b82f6;color:#fff;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  .msg{margin-top:12px;font-size:14px}
  .msg.ok{color:#9ae6b4}.msg.err{color:#fca5a5}
  .small{font-size:12px;color:#8b93a7;margin-top:8px}
</style>
</head>
<body>
  <div class="card">
    <h1>Access Portal</h1>
    <p>Enter your access code to unlock the site.</p>

    <input id="key" placeholder="Paste activation code here" autocomplete="one-time-code" />
    <button id="btn">Activate</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <div class="small">Tip: you can also open this page with <code>?activate=YOUR_CODE</code>.</div>
  </div>

<script>
  // === Config ===
  const COOKIE_NAME = 'access';
  const LIFETIME_DAYS = 9;
  const REDIRECT_TO = '/';

  // MUST match the generator page SECRET_KEY
  const SECRET_KEY = "sirco-is-best-also-any-person-looking-at-this-you-cant-you-are-going-against-the-code-of-conduct-123456767-abc";

  // Helper to read a cookie value by name (returns decoded value or null)
  function getCookie(name) {
    const m = document.cookie.match('(?:^|; )' + name.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&') + '=([^;]*)');
    return m ? decodeURIComponent(m[1]) : null;
  }

  // If an access cookie with the expected value is already present, immediately redirect.
  function hasValidAccess() {
    const v = getCookie(COOKIE_NAME);
    return v === '1';
  }

  if (hasValidAccess()) {
    // Use replace so this page doesn't remain in history
    location.replace(REDIRECT_TO);
  }

  const $ = (sel) => document.querySelector(sel);
  const $msg = $('#msg'), $btn = $('#btn'), $key = $('#key');

  function say(text, ok=false){
    $msg.textContent = text || '';
    $msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  // Build cookie string with Path=/; SameSite=Lax; Secure (when on HTTPS) and Max-Age
  function setAccessCookie(days){
    const maxAge = Math.floor(days * 24 * 60 * 60);
    const value = '1';
    const isHttps = location.protocol === 'https:';
    const attrs = [
      `Path=/`,
      `SameSite=Lax`,
      isHttps ? `Secure` : ``,
      `Max-Age=${maxAge}`
    ].filter(Boolean).join('; ');
    document.cookie = `${COOKIE_NAME}=${encodeURIComponent(value)}; ${attrs}`;
  }

  // === Helpers to reverse the generator encoding ===

  function hexToString(hex) {
    if (!hex || hex.length % 2 !== 0) return '';
    let out = '';
    for (let i = 0; i < hex.length; i += 2) {
      const byte = parseInt(hex.slice(i, i + 2), 16);
      if (Number.isNaN(byte)) return '';
      out += String.fromCharCode(byte);
    }
    return out;
  }

  async function sha256Hex(msg) {
    const buf = new TextEncoder().encode(msg);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  // Verify that a code came from the generator and is not expired
  async function verifyActivationCode(code) {
    try {
      if (!code) return { ok: false, reason: 'empty' };

      // Re-pad Base64 (generator stripped '=')
      const padLen = (4 - (code.length % 4)) % 4;
      const padded = code + '='.repeat(padLen);

      // Step 1: Base64 decode -> hex2
      const hex2 = atob(padded);

      // Step 2: hex2 -> hex1 (each 2 hex chars = char)
      const hex1 = hexToString(hex2);

      // Step 3: hex1 -> payload string
      const payloadStr = hexToString(hex1);
      if (!payloadStr) return { ok: false, reason: 'bad_payload' };

      const payload = JSON.parse(payloadStr);
      const { created, expires, sum } = payload || {};

      if (!created || !expires || !sum) {
        return { ok: false, reason: 'bad_payload' };
      }

      const now = Date.now();
      if (now > Number(expires)) {
        return { ok: false, reason: 'expired' };
      }

      const expectedSum = await sha256Hex(`${created}:${expires}:${SECRET_KEY}`);
      if (expectedSum !== sum) {
        return { ok: false, reason: 'bad_signature' };
      }

      return { ok: true };
    } catch (e) {
      console.error('verifyActivationCode error:', e);
      return { ok: false, reason: 'error' };
    }
  }

  async function activateWith(code){
    code = (code||'').trim();
    if (!code) {
      say('Please enter a code.');
      return;
    }

    say('Checking code…');

    const result = await verifyActivationCode(code);

    if (!result.ok) {
      if (result.reason === 'expired') {
        say('That activation code has expired.');
      } else {
        say('Invalid activation code.');
      }
      return;
    }

    // Valid + not expired
    setAccessCookie(LIFETIME_DAYS);
    say('Access granted! Redirecting…', true);
    setTimeout(()=> location.replace(REDIRECT_TO), 300);
  }

  $btn.addEventListener('click', ()=> activateWith($key.value));
  $key.addEventListener('keydown', (e)=> { if(e.key==='Enter') activateWith($key.value); });

  // Auto-run if opened with ?activate=... 
  (function autoFromQuery(){
    const sp = new URLSearchParams(location.search);
    const c = sp.get('activate');
    if(c){ $key.value = c; activateWith(c); }
  })();
</script>
</body>
</html>
