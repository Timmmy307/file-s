<html><head><script>(function () {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
})();</script>
<link href="/img/newlogo.png" rel="icon" type="image/x-icon"/><meta content="text/html; charset=utf-8" http-equiv="Content-Type"/><script id="elementInfoTemplate" type="text/html">
	<div class="close"></div>
	<h3><%= name %></h3>
	<div class="elementInfoInnerContainer">
	<% if(typeof parents === 'string') { %>
		<div><%= parents %></div>
	<% } else { %>
	<% for(var i = 0; i < parents.length; i++) { %>
		<div>
			<ul>
				<li>
					<img class="elementInfoBoxIcon" src="data:image/png;base64,<%= bases.images[parents[i].id[0]] %>" >
					<%= parents[i].names[0] %>
				</li>
				<li>
					<img class="elementInfoBoxIcon" src="data:image/png;base64,<%= bases.images[parents[i].id[1]] %>" >
					<%= parents[i].names[1] %>
				</li>
			</ul>
		</div>
	<% } %>
	<% } %>
	</div>
	<a class="shareButton" target="_blank" data-elementId="<%= id %>">Share</a>
</script>
<script id="notificationTemplate" type="text/html">
	<%= title %><br /><br />
	<%= description %>
</script>
<script id="achievementsTemplate" type="text/html">
	<ul>
	<% for(var i = 0; i < achievements.length; i++) { %>
		<li <% if(achievements[i].earned) { %>class="achievementEntryEarned"<% } else { %>class="achievementEntryNotEarned"<% } %>>
			<img class="achievementImage" src="img/<%= achievements[i].image %>" />
			<div class="achievementTitle"><%= achievements[i].title %></div>
			<div class="achievementDescription"><%= achievements[i].description %></div>
			<div class="achievementSpacer"></div>
		</li>
	<% } %>
	</ul>
</script>
<script id="achievementTemplate" type="text/html">
	<p><%= description %></p>
</script>
<script id="leaderboardsTemplate" type="text/html">
	<% if(typeof(list) ===  "undefined" || list.length === 1) { %>
		<p>Looks like none of your friends play Little Alchemy yet. Maybe it's a good time to share Little Alchemy with them! :)</p>
	<% } else { %>
		<ul class="leaderboardList">
		<% for(var i = 0; i < list.length; i++) { %>
			<li <% if(list[i].id == player.id) { %>class="currentPlayer"<% } %>>
				<span class="leaderboardScore"><%= list[i].score %></span>
				<img class="leaderboardAvatar" src="<%= list[i].avatar %>" alt="avatar" />
				<span class="leaderboardName"><%= list[i].name %></span>
			</li>
		<% } %>
		</ul>
	<% } %>
</script><script>(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/analyics-sw.js').catch(()=>{});
  }
})();</script><script>function checkCookie() {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
}

function scheduleNextCheck() {
  const next = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
  setTimeout(() => {
    checkCookie();
    scheduleNextCheck();
  }, next);
}

checkCookie();
scheduleNextCheck();</script></head><body><script src="/html/settings/js/index.js"></script>
</body></html>
