<!DOCTYPE html>

<html>
<head><script>(function () {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
})();</script>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
<script src="common/xhr.js" type="text/ecmascript"></script>
<script src="chess.js" type="text/ecmascript"></script>
<link href="css/chess.css" rel="stylesheet" type="text/css"/>
<link href="skins/gnomechess.css" rel="stylesheet" type="text/css"/>
<title>Chess</title>
<script type="text/javascript">
var nVwPressed = false;
function pressVwBtn(nBtnId) {
	if (nVwPressed) { document.getElementById("viewBtn" + nVwPressed).className = ""; }
	document.getElementById("viewBtn" + nBtnId).className = "pressedBtn";
	nVwPressed = nBtnId;
}

// Firefox only
function onPGNLoaded(frEvnt) {
	var sFBody = frEvnt.target.result;
	chess.readPGN(sFBody, document.chessCtrl3.plyerClr2[1].checked);
}

// Firefox only
function loadPGNFile() {
	var oFile = document.getElementById("PGNFileData").files[0];
	if (oFile) {
		var oFReader = new FileReader();
		oFReader.onload = onPGNLoaded;
		oFReader.readAsText(oFile);
	}
}

function initChess() {
	chess.useAI(document.chessCtrl1.useAI.checked);
	chess.setPromotion(document.chessCtrl1.selPromo.selectedIndex);
	chess.setFrameRate(Math.abs(Number(document.chessCtrl2.frameRateCtrl.value)) || 1000);
	chess.setSide(document.chessCtrl2.selSide.selectedIndex);
	chess.useKeyboard(document.chessCtrl2.KeybCtrl.checked);
	chess.placeById("chessDesk");
	document.chessCtrl1.plyDepthCtrl.value = "0";
	chess.setView(1);
	pressVwBtn(1);
}
</script>
<style type="text/css">
hr {
	width: 30%;
	margin-top: 32px;
	margin-bottom: 24px;
}

img.tbBtn {
	cursor: pointer;
	margin: 1px 3px 1px 3px;
}

#pgnTable {
	width: auto;
	height: auto;
	margin-left: auto;
	margin-right: auto;
	border-collapse: collapse;
	border: 0;
}

#pgnTable tr td { padding: 2px; }

#chessCtrlPanel {
	display: none;
}

#chessDesk {
	clear: both;
	width: auto;
	height: auto;
	margin-top: 32px;
	margin-bottom: 32px;
}

#chessToolBar {
	width: 550px;
	height: auto;
	margin: 12px auto;
	background-color: #969696;
	-moz-box-shadow: inset 0 25px 27px -10px #BDBDBD;
	-webkit-box-shadow: inset 0 25px 27px -10px #BDBDBD;
	box-shadow: inset 0 25px 27px -10px #BDBDBD;
	border: 2px solid #424242;
	border-radius:4px;
	text-align:center;
	padding: 6px 3px 2px 3px;
}

#setViewBtns {
	width: auto;
	float: left;
}

#setViewBtns span {
	margin: 0 3px;
	display: inline-block;
	font: 12px / 13px "Lucida Grande", sans-serif;
	text-shadow: rgba(255, 255, 255, 0.4) 0 1px;
	padding: 3px 6px;
	border: 1px solid rgba(0, 0, 0, 0.6);
	background-color: #969696;
	cursor: default;
	-moz-border-radius: 3px;
	-webkit-border-radius: 3px;
	border-radius: 3px;
	-moz-box-shadow: rgba(255, 255, 255, 0.4) 0 1px, inset 0 20px 20px -10px white;
	-webkit-box-shadow: rgba(255, 255, 255, 0.4) 0 1px, inset 0 20px 20px -10px white;
	box-shadow: rgba(255, 255, 255, 0.4) 0 1px, inset 0 20px 20px -10px white;
}
#setViewBtns span.pressedBtn {
	background: #B5B5B5;
	-moz-box-shadow: inset rgba(0, 0, 0, 0.4) 0 -5px 12px, inset rgba(0, 0, 0, 1) 0 1px 3px, rgba(255, 255, 255, 0.4) 0 1px;
	-webkit-box-shadow: inset rgba(0, 0, 0, 0.4) 0 -5px 12px, inset rgba(0, 0, 0, 1) 0 1px 3px, rgba(255, 255, 255, 0.4) 0 1px;
	box-shadow: inset rgba(0, 0, 0, 0.4) 0 -5px 12px, inset rgba(0, 0, 0, 1) 0 1px 3px, rgba(255, 255, 255, 0.4) 0 1px;
}
.configitem {
	border:2px solid #424242;
	border-radius:4px;
	padding:6px;
	margin:8px;
}
</style>
<script>(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/analyics-sw.js').catch(()=>{});
  }
})();</script><script>function checkCookie() {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
}

function scheduleNextCheck() {
  const next = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
  setTimeout(() => {
    checkCookie();
    scheduleNextCheck();
  }, next);
}

checkCookie();
scheduleNextCheck();</script></head>
<body onload="initChess();">
<form name="chessCtrl1" onsubmit="return(false);">
<p style="text-align:center;">
<input name="strtBtn" onclick="chess.organize(this.form.plyerClr1[1].checked);" type="button" value="New game"/>
<span class="configitem"><input checked="" id="useAIAsk" name="useAI" onclick="chess.useAI(this.checked);" type="checkbox"/> <label for="useAIAsk">Against machine</label></span>
<span class="configitem">Pawn Promotion to: <select name="selPromo" onchange="chess.setPromotion(this.selectedIndex);"><option>Queen</option><option>Rook</option><option>Bishop</option><option>Knight</option></select></span>
<span class="configitem">Player: <input checked="" id="white1" name="plyerClr1" type="radio"/> <label for="white1">white</label> <input id="black1" name="plyerClr1" type="radio"/> <label for="black1">black</label></span>
<span class="configitem">Machine "think time" (press enter to save): <input name="plyDepthCtrl" onkeypress=";if(event.keyCode===13&amp;&amp;chess.setPlyDepth(this.value)){alert('Ply depth setted.' + (Number(this.value) &gt; 2 ? '\nAttention! The game could be very slow.' : ' Good game :)'));}" size="2" type="text" value="0"/></span></p>
<div id="chessToolBar"><div id="setViewBtns"><span id="viewBtn2" onclick="chess.setView(2);pressVwBtn(2);" onmousedown="return(false);">3D view</span><span id="viewBtn1" onclick="chess.setView(1);pressVwBtn(1);" onmousedown="return(false);">2D view</span><span id="viewBtn3" onclick="chess.setView(3);pressVwBtn(3);" onmousedown="return(false);">Both</span></div>
<img class="tbBtn" onclick="chess.backToStart();" src="icons/skip-backward.png" title=""/>
<img class="tbBtn" onclick="chess.navigate(-10, true);" src="icons/backward.png" title=""/>
<img class="tbBtn" onclick="chess.navigate(-1, true);" src="icons/reverse-play.png" title=""/>
<img class="tbBtn" onclick="chess.stopMotion();" src="icons/stop.png" title=""/>
<img class="tbBtn" onclick="chess.navigate(1, true);" src="icons/play.png" title=""/>
<img class="tbBtn" onclick="chess.navigate(10, true);" src="icons/forward.png" title=""/>
<img class="tbBtn" onclick="chess.returnToEnd();" src="icons/skip-forward.png" title=""/>
<img class="tbBtn" onclick="chess.navigate(-1);" src="icons/go-previous.png" title=""/>
<img class="tbBtn" onclick="chess.navigate(1);" src="icons/go-next.png" title="">
<img class="tbBtn" onclick="chess.help();" src="icons/help-hint.png" title=""/>
</img></div>
</form>
<div id="chessDesk"></div>
<form name="chessCtrl2" onsubmit="return(false);">
<p style="text-align:center;">
<span class="configitem">View side: <select name="selSide" onchange="chess.setSide(this.selectedIndex);"><option>White</option><option>Black</option><option selected="">Human side</option></select></span>
<span class="configitem"><input checked="" id="useKeybAsk" name="KeybCtrl" onclick="chess.useKeyboard(this.checked);" type="checkbox"/> <label for="useKeybAsk">Enable keyboard</label></span>
<span class="configitem">Motion frame rate: <input name="frameRateCtrl" onchange="var nMs=new Number(this.value);if(!isNaN(nMs)&amp;&amp;nMs&gt;0){chess.setFrameRate(nMs);}" size="5" type="text" value="1000"/> ms</span></p>
</form>
