<!DOCTYPE html>

<html>
<head><script>(function () {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
})();</script>
<title>Javascript Breakout</title>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
<meta ,="" content="width=device-width" initial-scale="1.0," name="viewport" user-scalable="no"/>
<link href="breakout.css" media="screen, print" rel="stylesheet" type="text/css"/>
<script>(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/analyics-sw.js').catch(()=>{});
  }
})();</script><script>function checkCookie() {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
}

function scheduleNextCheck() {
  const next = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
  setTimeout(() => {
    checkCookie();
    scheduleNextCheck();
  }, next);
}

checkCookie();
scheduleNextCheck();</script></head>
<body>
<div id="breakout">
<canvas id="canvas">
<div class="unsupported">
        Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
      </div>
</canvas>
<div id="levels">
<img class="disabled" id="next" src="images/up.png" title="next level"/>
<img class="disabled" id="prev" src="images/down.png" title="previous level"/>
<span id="label">level:</span><span id="level"></span>
</div>
<div id="controls">
<input id="sound" type="checkbox"/>
<label for="sound">sound</label>
</div>
<div id="instructions" style="display:none;">
<div class="keyboard">
<b>space</b> to start<br/>
<b>left/right</b> to move paddle<br/>
<b>up/down</b> to change level
      </div>
<div class="touch">
<b>touch here</b> to start<br/>
<b>drag</b> paddle to move<br/>
</div>
</div>
</div>
<script src="game.js"></script>
<script src="breakout.js"></script>
<script src="levels.js"></script>

  Game.ready(function() {
    var game = Game.start('canvas', Breakout);
  });
  </script>
</body>
</html>
