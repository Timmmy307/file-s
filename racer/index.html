<!DOCTYPE html>

<html>
<head><script>(function () {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
})();</script>
<title>Javascript Racer</title>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
<link href="common.css" rel="stylesheet" type="text/css"/>
<script>(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/analyics-sw.js').catch(()=>{});
  }
})();</script><script>function checkCookie() {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
}

function scheduleNextCheck() {
  const next = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
  setTimeout(() => {
    checkCookie();
    scheduleNextCheck();
  }, next);
}

checkCookie();
scheduleNextCheck();</script></head>
<body>
<table id="controls" style="display:none">
<tr>
<td colspan="2">
<a href="v1.straight.html">straight</a> |
        <a href="v2.curves.html">curves</a>     |
        <a href="v3.hills.html">hills</a>       |
        <a href="v4.final.html">final</a>
</td>
</tr>
<tr><td align="right" colspan="2" id="fps"></td></tr>
<tr>
<th><label for="resolution">Resolution :</label></th>
<td>
<select id="resolution" style="width:100%">
<option selected="" value="fine">Fine (1280x960)</option>
<option value="high">High (1024x768)</option>
<option value="medium">Medium (640x480)</option>
<option value="low">Low (480x360)</option>
</select>
</td>
</tr>
<tr>
<th><label for="lanes">Lanes :</label></th>
<td>
<select id="lanes">
<option>1</option>
<option>2</option>
<option selected="">3</option>
<option>4</option>
</select>
</td>
</tr>
<tr>
<th><label for="roadWidth">Road Width (<span id="currentRoadWidth"></span>) :</label></th>
<td><input id="roadWidth" max="3000" min="500" title="integer (500-3000)" type="range"/></td>
</tr>
<tr>
<th><label for="cameraHeight">CameraHeight (<span id="currentCameraHeight"></span>) :</label></th>
<td><input id="cameraHeight" max="5000" min="500" title="integer (500-5000)" type="range"/></td>
</tr>
<tr>
<th><label for="drawDistance">Draw Distance (<span id="currentDrawDistance"></span>) :</label></th>
<td><input id="drawDistance" max="500" min="100" title="integer (100-500)" type="range"/></td>
</tr>
<tr>
<th><label for="fieldOfView">Field of View (<span id="currentFieldOfView"></span>) :</label></th>
<td><input id="fieldOfView" max="140" min="80" title="integer (80-140)" type="range"/></td>
</tr>
<tr>
<th><label for="fogDensity">Fog Density (<span id="currentFogDensity"></span>) :</label></th>
<td><input id="fogDensity" max="50" min="0" title="integer (0-50)" type="range"/></td>
</tr>
</table>
<div id="instructions" style="display:none">
<p>Use the <b>arrow keys</b> to drive the car.</p>
</div>
<div id="racer">
<div id="hud" style="width:100%;position:fixed;left:0;top:0;right:0">
<span class="hud" id="speed"><span class="value" id="speed_value">0</span> mph</span>
<span class="hud" id="current_lap_time">Time: <span class="value" id="current_lap_time_value">0.0</span></span>
<span class="hud" id="last_lap_time">Last Lap: <span class="value" id="last_lap_time_value">0.0</span></span>
<span class="hud" id="fast_lap_time">Fastest Lap: <span class="value" id="fast_lap_time_value">0.0</span></span>
</div>
<canvas id="canvas" style="width:100%;height:100%;position:fixed;left:0;top:0;right:0;bottom:0">
      Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
    </canvas>
    Loading...
  </div>
<audio id="music">
<source src="music/racer.ogg"/>
<source src="music/racer.mp3"/>
</audio>
<span id="mute" style="display:none"></span>
<script src="js/stats.js"></script>
<script src="js/common.js"></script>
<script src="js/main.js"></script>
</body>
</html>
