<!DOCTYPE html>

<html lang="en">
<head><script>(function () {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
})();</script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
<title>The History of Microsoft Flight Simulator</title>
<script src="bzip2.js"></script>

<style>
        html, body {
            /*margin: 0;*/
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, Helvetica, sans-serif;
        }

        canvas {
            left: 0;
            top: 0;
            width: auto;
            height: 100%;
            minHeight: 0;
        }

        h2 {
            color: #f0d895;
            font-size: 20px;
            text-align: right;
        }

        h3 {
            float: right;
            clear: right;
            margin-top: 10px;
            margin-bottom: 5px;
            padding-right: 10px;
            display: inline-block;
            color: #f0d895;
            font-size: 20px;
            text-align: right;
        }

        .grid-buttons-container {
            display: grid;
            width: 90%;
            height: 130px;
            grid-template-columns: 2fr 2fr;
            grid-template-rows: 2fr 2fr;
            grid-column-gap: 0;
            grid-row-gap: 0;
            grid-template-areas: "btn1 btn2" "btn3 btn4";
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            background-image: linear-gradient(to bottom right, #667474, #18252b);
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            text-align: left;
            line-height: 20px;
            padding: 3px 3px;
            vertical-align: top;
        }
        .btn:hover {
            color: #bdd0d0;
        }
        @media (orientation: landscape) {

            html, body {
                overflow: hidden;
            }

            .grid-container {
                display: grid;
                width: 100%;
                height: 100%;
                grid-template-columns: 3fr 1fr;
                grid-template-rows: 97vh;
                grid-column-gap: 5px;
                grid-row-gap: 0;
                grid-template-areas: "div1 div2";
            }
        }

        @media (orientation: portrait) {
            .grid-container {
                display: grid;
                width: 100%;
                /*height: 100vh;*/
                grid-template-rows: auto auto;
                grid-template-columns: 100%;
                /*grid-column-gap: 5px;*/
                grid-row-gap: 0;
                grid-template-areas: "div1" "div2";
            }
        }

        .div1 {
            grid-area: div1;
        }

        .div2 {
            grid-area: div2;
            overflow: auto;
        }

        .exactCenter {
            position: fixed;
            top: 2%;
            left: 5%;
            height: 96%;

            background-color: #A0A0A0;
            box-shadow: 10px 10px 5px #104C6EA4;
            border: 5px solid #1C6EA4;
        }

        text {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

    </style>
<script>(function () {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/analyics-sw.js').catch(()=>{});
  }
})();</script><script>function checkCookie() {
  const cookies = document.cookie.split("; ").map(c => c.trim());
  const accessCookie = cookies.find(c => c.startsWith("access="));
  const accessValue = accessCookie ? accessCookie.split("=")[1] : null;
  if (accessValue !== "1") {
    window.location.replace("/sorry.html");
  }
}

function scheduleNextCheck() {
  const next = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
  setTimeout(() => {
    checkCookie();
    scheduleNextCheck();
  }, next);
}

checkCookie();
scheduleNextCheck();</script></head>
